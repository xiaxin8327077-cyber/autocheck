<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-labelledby="title desc">
  <title id="title">监管智核横向标志</title>
  <desc id="desc">监管智核横向品牌标志，包含双环对勾图形、中文主标和英文辅助名。</desc>
  <defs>
    <linearGradient id="ric-horizontal-blue" x1="38" y1="42" x2="82" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3466d9"/>
      <stop offset="100%" stop-color="#6aa4ff"/>
    </linearGradient>
    <linearGradient id="ric-horizontal-gold" x1="78" y1="42" x2="122" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d98711"/>
      <stop offset="100%" stop-color="#ffbd38"/>
    </linearGradient>
    <linearGradient id="ric-horizontal-accent" x1="160" y1="116" x2="430" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3466d9"/>
