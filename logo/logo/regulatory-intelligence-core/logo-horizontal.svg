  <circle cx="80" cy="123" r="4.2" fill="#3466d9"/>
  <text x="158" y="76" fill="#0f172a" font-size="44" font-weight="800" font-family="Microsoft YaHei, PingFang SC, Source Han Sans SC, Noto Sans CJK SC, sans-serif">监管智核</text>
