<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="title desc">
  <title id="title">监管智核标志图形</title>
  <desc id="desc">蓝金双环交叠，分别包含核验对勾，下方以虚线连接到核心节点。</desc>
  <defs>
    <linearGradient id="ric-mark-blue" x1="18" y1="22" x2="62" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3466d9"/>
      <stop offset="100%" stop-color="#6aa4ff"/>
    </linearGradient>
    <linearGradient id="ric-mark-gold" x1="58" y1="22" x2="102" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d98711"/>
      <stop offset="100%" stop-color="#ffbd38"/>
    </linearGradient>
    <filter id="ric-mark-shadow" x="12" y="18" width="96" height="76" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#15305f" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#ric-mark-shadow)">
