    <path d="M31 52.5L38.5 60L53 42.5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M67 52.5L74.5 60L89 42.5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M60 79V97" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="60" cy="103" r="4.2" fill="#3466d9"/>
  <circle cx="60" cy="103" r="1.8" fill="#ffffff" opacity="0.75"/>
