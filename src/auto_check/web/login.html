<!doctype html>
<html lang="zh-CN" data-login-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>监管智核</title>
    <link rel="icon" href="/assets/favicon-64x64.svg?v=2.0.8-regulatory-intelligence-core" />
    <script id="initialInterfaceRadiusScript">
      (() => {
        const LAST_INTERFACE_RADIUS_CACHE_KEY = "autoCheckLastInterfaceRadius";
        const DEFAULT_LOGIN_INTERFACE_RADIUS_PX = 4;

        function normalizeLoginInterfaceRadius(value) {
          const parsed = Number(value);
          return Number.isInteger(parsed) && parsed >= 1 && parsed <= 15
            ? parsed
            : DEFAULT_LOGIN_INTERFACE_RADIUS_PX;
        }

        let radiusPx = DEFAULT_LOGIN_INTERFACE_RADIUS_PX;
        try {
          radiusPx = normalizeLoginInterfaceRadius(localStorage.getItem(LAST_INTERFACE_RADIUS_CACHE_KEY));
        } catch (_) {}
        document.documentElement.style.setProperty("--ui-radius", `${radiusPx}px`);
      })();
    </script>
    <script id="initialLoginThemeColorScript">
      (() => {
        const DEFAULT_EFFECTIVE_THEME_COLORS = Object.freeze({
          vitality: "#3466D9",
          calm: "#355F63",
        });
        const LOGIN_PAGE_BACKGROUNDS = Object.freeze({
          light: "radial-gradient(circle at 10% 14%, rgba(52, 102, 217, 0.17), transparent 46%), radial-gradient(circle at 98% 94%, rgba(255, 189, 56, 0.08), transparent 30%), linear-gradient(135deg, #EEF4FF 0%, #F8FAFC 58%, #FFFAF4 100%)",
          dark: "radial-gradient(circle at 10% 14%, rgba(106, 164, 255, 0.16), transparent 46%), radial-gradient(circle at 98% 94%, rgba(217, 135, 17, 0.07), transparent 30%), linear-gradient(135deg, #111D35 0%, #141B29 58%, #211D18 100%)",
        });
        const root = document.documentElement;
        let effectiveColors = { ...DEFAULT_EFFECTIVE_THEME_COLORS };

        function normalizeThemeHex(value) {
          if (typeof value !== "string" || !/^#[0-9A-Fa-f]{6}$/.test(value)) return null;
          return value.toUpperCase();
        }

        function hexToRgb(value) {
          return {
            red: Number.parseInt(value.slice(1, 3), 16),
            green: Number.parseInt(value.slice(3, 5), 16),
            blue: Number.parseInt(value.slice(5, 7), 16),
          };
        }

        function rgbToHex({ red, green, blue }) {
          const channel = (value) => Math.max(0, Math.min(255, Math.round(value)))
            .toString(16)
            .padStart(2, "0")
            .toUpperCase();
          return `#${channel(red)}${channel(green)}${channel(blue)}`;
        }

        function mixHex(from, to, ratio) {
          const start = hexToRgb(from);
          const end = hexToRgb(to);
          const weight = Math.max(0, Math.min(1, ratio));
          return rgbToHex({
            red: start.red + ((end.red - start.red) * weight),
            green: start.green + ((end.green - start.green) * weight),
            blue: start.blue + ((end.blue - start.blue) * weight),
          });
        }

        function relativeLuminance(value) {
          const rgb = hexToRgb(value);
          const linearize = (channel) => {
            const srgb = channel / 255;
            return srgb <= 0.04045
              ? srgb / 12.92
              : ((srgb + 0.055) / 1.055) ** 2.4;
          };
          return (
            (0.2126 * linearize(rgb.red))
            + (0.7152 * linearize(rgb.green))
            + (0.0722 * linearize(rgb.blue))
          );
        }

        function contrastRatio(first, second) {
          const lighter = Math.max(relativeLuminance(first), relativeLuminance(second));
          const darker = Math.min(relativeLuminance(first), relativeLuminance(second));
          return (lighter + 0.05) / (darker + 0.05);
        }

        function selectedThemeKey() {
          return "vitality";
        }

        function derivePalette(accent, mode, themeKey) {
          const surface = mode === "dark" ? "#121318" : "#F7FAFC";
          const blackContrast = contrastRatio(accent, "#000000");
          const whiteContrast = contrastRatio(accent, "#FFFFFF");
          const onAccent = whiteContrast >= 4.5 || whiteContrast >= blackContrast
            ? "#FFFFFF"
            : "#000000";
          const readableTarget = mode === "dark" ? "#FFFFFF" : "#000000";
          let readableAccent = accent;
          for (let step = 1; contrastRatio(readableAccent, surface) < 4.5 && step <= 100; step += 1) {
            readableAccent = mixHex(accent, readableTarget, step / 100);
          }
          const rgb = hexToRgb(accent);
          return {
            accent,
            onAccent,
            readableAccent,
            gradientEnd: accent === "#3466D9" ? "#6AA4FF" : mixHex(accent, "#FFFFFF", 0.36),
            accentSoft: `rgba(${rgb.red}, ${rgb.green}, ${rgb.blue}, ${mode === "dark" ? "0.20" : "0.12"})`,
            focusRing: `rgba(${rgb.red}, ${rgb.green}, ${rgb.blue}, ${mode === "dark" ? "0.38" : "0.28"})`,
            pageBackground: LOGIN_PAGE_BACKGROUNDS[mode],
          };
        }

        function applyColors() {
          effectiveColors = { ...DEFAULT_EFFECTIVE_THEME_COLORS };
          const themeKey = selectedThemeKey();
          const mode = root.getAttribute("data-login-theme") === "dark" ? "dark" : "light";
          const palette = derivePalette(effectiveColors[themeKey], mode, themeKey);
          root.style.setProperty("--theme-accent", palette.accent);
          root.style.setProperty("--theme-accent-gradient-end", palette.gradientEnd);
          root.style.setProperty("--theme-accent-gradient", `linear-gradient(90deg, ${palette.accent} 0%, ${palette.gradientEnd} 100%)`);
          root.style.setProperty("--theme-on-accent", palette.onAccent);
          root.style.setProperty("--theme-accent-readable", palette.readableAccent);
          root.style.setProperty("--theme-accent-soft", palette.accentSoft);
          root.style.setProperty("--theme-focus-ring", palette.focusRing);
          root.style.setProperty("--theme-page-background", palette.pageBackground);
          return palette;
        }

        root.setAttribute("data-login-theme", "light");
        applyColors();
        window.autoCheckLoginThemeColors = {
          apply: applyColors,
          reapply: () => applyColors(effectiveColors),
          colors: () => ({ ...effectiveColors }),
        };
      })();
    </script>
    <style>
      :root {
        --ui-radius: 4px;
        --theme-accent: #3466D9;
        --theme-accent-gradient-end: #6AA4FF;
        --theme-accent-gradient: linear-gradient(90deg, #3466D9 0%, #6AA4FF 100%);
        --theme-on-accent: #FFFFFF;
        --theme-accent-readable: #3466D9;
        --theme-accent-soft: rgba(52, 102, 217, 0.12);
        --theme-focus-ring: rgba(52, 102, 217, 0.28);
        --theme-page-background:
          radial-gradient(circle at 10% 14%, rgba(52, 102, 217, 0.17), transparent 46%),
          radial-gradient(circle at 98% 94%, rgba(255, 189, 56, 0.08), transparent 30%),
          linear-gradient(135deg, #EEF4FF 0%, #F8FAFC 58%, #FFFAF4 100%);
        --surface: rgba(255, 255, 255, 0.88);
        --field-surface: #FFFFFF;
        --shadow-light: #ffffff;
        --shadow-dark: rgba(0, 0, 0, 0.05);
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --field-text: #475569;
        --field-border: #CBD5E1;
        --error: #dc2626;
        --success: #047857;
      }

      :root[data-login-theme="dark"] {
        --surface: #1C212B;
        --field-surface: #151A22;
        --shadow-light: #303747;
        --shadow-dark: #151922;
        --text-primary: #f4f7fb;
        --text-secondary: #a7b0c0;
        --field-text: #a7b0c0;
        --field-border: #3A4352;
        --error: #f87171;
        --success: #34d399;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: var(--text-primary);
        background: var(--theme-page-background);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .theme-toggle {
        position: fixed;
        top: 22px;
        right: 24px;
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 16px;
        z-index: 3;
        color: var(--theme-accent-readable);
        background: var(--surface);
        cursor: pointer;
        backdrop-filter: blur(16px);
        border: 1px solid var(--field-border);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      :root[data-login-theme="dark"] .theme-toggle {
        color: var(--theme-accent-readable);
        background: var(--surface);
        border-color: var(--field-border);
        box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      }

      .login-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 440px;
        padding: 20px;
      }

      .right-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .right-panel {
        padding: 34px 32px 34px;
        background: var(--surface);
        backdrop-filter: blur(20px);
        border: 1px solid var(--field-border);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.03);
      }

      :root[data-login-theme="dark"] .right-panel {
        background: var(--surface);
        border-color: var(--field-border);
        box-shadow: 0 14px 42px rgba(0, 0, 0, 0.28);
      }

      .light-brand {
        position: relative;
        isolation: isolate;
        min-height: 128px;
        display: flex;
        align-items: center;
        text-align: left;
        margin-bottom: 14px;
      }

      @keyframes lightBrandBubbleFloat {
        0%, 10% { transform: translate3d(-28px, 7px, 0) scale(1); }
        16% { transform: translate3d(-25px, -2px, 0) scale(1.002, 0.999); }
        24% { transform: translate3d(-18px, -14px, 0) scale(0.998, 1.004); }
        32% { transform: translate3d(-8px, -22px, 0) scale(0.994, 1.008); }
        40% { transform: translate3d(4px, -12px, 0) scale(0.998, 1.004); }
        48% { transform: translate3d(12px, 0, 0) scale(1.004, 0.998); }
        56% { transform: translate3d(22px, 7px, 0) scale(1.008, 0.996); }
        64% { transform: translate3d(32px, 0, 0) scale(1.004, 0.998); }
        72% { transform: translate3d(40px, -12px, 0) scale(0.998, 1.004); }
        80% { transform: translate3d(52px, -22px, 0) scale(0.994, 1.008); }
        86% { transform: translate3d(58px, -16px, 0) scale(0.996, 1.006); }
        91% { transform: translate3d(63px, -5px, 0) scale(1.002, 0.999); }
        96%, 100% { transform: translate3d(68px, 7px, 0) scale(1); }
      }

      @keyframes lightBrandBubbleWarmth {
        0%, 22% { opacity: 0; }
        42% { opacity: 0.22; }
        68% { opacity: 0.38; }
        96%, 100% { opacity: 0.46; }
      }

      .light-brand::before,
      .light-brand::after {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        top: 6px;
        left: 12px;
        z-index: 0;
        border-radius: 50%;
        pointer-events: none;
        transform-origin: center;
        will-change: transform, opacity;
        animation: lightBrandBubbleFloat 14s linear infinite alternate;
      }

      .light-brand::before {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(6, 182, 212, 0.12), rgba(124, 58, 237, 0.16));
        box-shadow: 0 24px 54px rgba(37, 99, 235, 0.13);
      }

      .light-brand::after {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.34), rgba(250, 204, 21, 0.28), rgba(251, 191, 36, 0.22));
        box-shadow: 0 16px 36px rgba(217, 119, 6, 0.13);
        opacity: 0;
        animation: lightBrandBubbleFloat 14s linear infinite alternate, lightBrandBubbleWarmth 14s linear infinite alternate;
      }

      .login-brand-logo {
        position: relative;
        z-index: 1;
        display: block;
        width: min(360px, 100%);
        height: auto;
        margin: 0;
      }

      .welcome-title {
        display: none;
        margin-bottom: 8px;
        color: var(--text-primary);
        font-size: 28px;
        font-weight: 800;
      }

      .welcome-subtitle {
        display: none;
        margin-bottom: 28px;
        color: var(--text-secondary);
        font-size: 14px;
      }

      .form-group { margin-bottom: 18px; }

      .form-label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 600;
      }

      .password-field {
        position: relative;
      }

      .form-input {
        width: 100%;
        height: 50px;
        padding: 0 18px;
        border: 1.5px solid var(--field-border);
        border-radius: 14px;
        outline: none;
        color: var(--text-primary);
        background: var(--field-surface);
        caret-color: var(--theme-accent-readable);
        font-size: 15px;
        box-shadow: none;
        transition: all 0.25s ease;
      }

      .form-input::placeholder { color: #cbd5e1; }

      :root[data-login-theme="dark"] .form-input {
        border-color: var(--field-border);
        color: var(--text-primary);
        background: var(--field-surface);
        box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
      }

      :root[data-login-theme="dark"] .form-input::placeholder {
        color: var(--text-secondary);
      }

      :root[data-login-theme="dark"] .form-input:-webkit-autofill,
      :root[data-login-theme="dark"] .form-input:-webkit-autofill:hover,
      :root[data-login-theme="dark"] .form-input:-webkit-autofill:focus {
        caret-color: var(--theme-accent-readable);
        border-color: var(--theme-accent-readable);
        -webkit-text-fill-color: var(--text-primary);
        -webkit-box-shadow:
          0 0 0 1000px var(--field-surface) inset,
          inset 6px 6px 12px var(--shadow-dark),
          inset -6px -6px 12px var(--shadow-light);
        transition: background-color 9999s ease-out, color 9999s ease-out;
      }

      .password-field .form-input {
        padding-right: 58px;
      }

      .password-field .form-input::-ms-reveal,
      .password-field .form-input::-ms-clear {
        display: none;
      }

      .password-toggle {
        position: absolute;
        top: calc(50% + 13px);
        right: 12px;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        transform: translateY(-50%);
        border: 0;
        border-radius: 12px;
        color: var(--theme-accent-readable);
        background: transparent;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }

      .password-toggle:hover {
        color: var(--theme-accent-readable);
        background: var(--theme-accent-soft);
      }

      .form-input:focus {
        border-color: var(--theme-accent-readable);
        background: var(--field-surface);
        box-shadow: 0 0 0 4px var(--theme-focus-ring);
      }

      :root[data-login-theme="dark"] .form-input:focus {
        background: var(--field-surface);
        box-shadow: 0 0 0 4px var(--theme-focus-ring);
      }

      .form-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 16px 0 28px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .remember-me input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--theme-accent);
        cursor: pointer;
      }

      .remember-me label {
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 13px;
      }

      .forgot-password {
        border: 0;
        background: transparent;
        color: var(--theme-accent-readable);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }

      :root[data-login-theme="dark"] .forgot-password {
        color: var(--theme-accent-readable);
      }

      .login-btn {
        width: 100%;
        height: 52px;
        margin-top: 8px;
        border: 0;
        border-radius: 14px;
        color: var(--theme-on-accent);
        background: var(--theme-accent);
        background-image: var(--theme-accent-gradient);
        cursor: pointer;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 1px;
        box-shadow: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px var(--theme-focus-ring);
      }

      .login-btn:disabled { cursor: wait; opacity: 0.72; transform: none; }

      :root[data-login-theme="dark"] .login-btn {
        color: var(--theme-on-accent);
        background: var(--theme-accent);
        background-image: var(--theme-accent-gradient);
        box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      }

      :root[data-login-theme="dark"] .login-btn:hover {
        box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      }

      .login-message {
        min-height: 22px;
        margin-top: 18px;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.5;
      }

      .login-message.error { color: var(--error); }
      .login-message.success { color: var(--success); }

      .login-footer {
        margin-top: 24px;
        color: var(--theme-accent-readable);
        text-align: center;
        font-size: 13px;
      }

      .login-footer a {
        color: var(--theme-accent-readable);
        text-decoration: none;
        font-weight: 500;
      }

      .login-footer a:hover {
        text-decoration: underline;
      }

      .divider {
        display: none;
        align-items: center;
        margin: 32px 0;
      }

      .divider-line {
        flex: 1;
        height: 1px;
        background: var(--shadow-dark);
      }

      .divider-text {
        padding: 0 16px;
        color: var(--text-secondary);
        font-size: 12px;
      }

      .social-login {
        display: none;
        gap: 12px;
      }

      .social-btn {
        height: 56px;
        border: 0;
        border-radius: 16px;
        background: var(--surface);
        color: var(--text-primary);
        cursor: pointer;
        font-size: 20px;
        box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
        transition: transform 0.2s ease;
      }

      .social-btn:hover { transform: translateY(-2px); }

      .right-panel,
      .form-input,
      .login-btn {
        border-radius: var(--ui-radius);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="right-panel">
        <div class="light-brand">
          <img class="login-brand-logo" src="/assets/logo-login.svg?v=2.0.8-regulatory-intelligence-core-horizontal" alt="监管智核" />
        </div>
        <h2 class="welcome-title" id="loginTitle">欢迎登录</h2>
        <p class="welcome-subtitle" id="loginSubtitle">请输入管理员密码继续访问系统。</p>
        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="loginUsername">用户名</label>
            <input id="loginUsername" class="form-input" type="text" placeholder="请输入用户名" autocomplete="username" />
          </div>
          <div class="form-group password-field">
            <label class="form-label" for="loginPassword">密码</label>
            <input id="loginPassword" class="form-input" type="password" placeholder="请输入密码" autocomplete="current-password" required />
            <button id="loginPasswordToggle" class="password-toggle" type="button" aria-label="显示密码" title="显示密码">
              <span class="password-toggle-icon" aria-hidden="true">👁</span>
            </button>
          </div>
          <div class="form-group password-field" id="confirmGroup" hidden>
            <label class="form-label" for="loginPasswordConfirm">确认密码</label>
            <input id="loginPasswordConfirm" class="form-input" type="password" placeholder="再次输入密码" autocomplete="new-password" />
          </div>
          <div class="form-options">
            <div class="remember-me">
              <input type="checkbox" id="rememberLogin" />
              <label for="rememberLogin">记住我</label>
            </div>
            <button class="forgot-password" id="forgotPasswordBtn" type="button">忘记密码？</button>
          </div>
          <button class="login-btn" id="loginSubmit" type="submit">登录</button>
          <div class="login-message" id="loginMessage" role="status"></div>
        </form>
        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">其他登录方式</span>
          <div class="divider-line"></div>
        </div>
        <div class="social-login">
          <button class="social-btn" type="button" title="微信" data-provider="微信">💬</button>
          <button class="social-btn" type="button" title="钉钉" data-provider="钉钉">📱</button>
          <button class="social-btn" type="button" title="LDAP" data-provider="LDAP">🔐</button>
        </div>
      </div>
    </div>
    <script src="/crypto_fallback.js"></script>
    <script>
      const root = document.documentElement;
      const themeToggle = document.getElementById("loginThemeToggle");
      const loginBrandLogo = document.querySelector(".light-brand .login-brand-logo");
      const form = document.getElementById("loginForm");
      const usernameInput = document.getElementById("loginUsername");
      const passwordInput = document.getElementById("loginPassword");
      const passwordToggle = document.getElementById("loginPasswordToggle");
      const confirmInput = document.getElementById("loginPasswordConfirm");
      const confirmGroup = document.getElementById("confirmGroup");
      const message = document.getElementById("loginMessage");
      const submitBtn = document.getElementById("loginSubmit");
      const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");
      const rememberLogin = document.getElementById("rememberLogin");
      const REMEMBERED_USERNAME_KEY = "autoCheckRememberedUsername";
      const MAIN_ENTRY_ANIMATION_KEY = "autoCheckMainEntryAnimation";
      const USER_AVATAR_SESSION_KEY = "autoCheckUserAvatarVariant";
      const USER_AVATAR_VARIANT_COUNT = 6;
      let setupRequired = false;
      let loginSubmitting = false;

      function applyTheme(theme) {
        const normalized = "light";
        root.setAttribute("data-login-theme", normalized);
        loginBrandLogo.src = "/assets/logo-login.svg?v=2.0.8-regulatory-intelligence-core-horizontal";
        window.autoCheckLoginThemeColors.reapply();
        localStorage.removeItem("autoCheckLoginTheme");
      }

      function togglePasswordVisibility() {
        passwordInput.type = passwordInput.type === "password" ? "text" : "password";
        const visible = passwordInput.type === "text";
        passwordToggle.setAttribute("aria-label", visible ? "隐藏密码" : "显示密码");
        passwordToggle.title = visible ? "隐藏密码" : "显示密码";
      }

      function loadRememberedUsername() {
        const remembered = localStorage.getItem(REMEMBERED_USERNAME_KEY) || "";
        rememberLogin.checked = Boolean(remembered);
        return remembered;
      }

      function saveRememberedUsername(username) {
        if (rememberLogin.checked) {
          localStorage.setItem(REMEMBERED_USERNAME_KEY, username);
        } else {
          localStorage.removeItem(REMEMBERED_USERNAME_KEY);
        }
      }

      function refreshUserAvatarVariant() {
        try {
          sessionStorage.setItem(USER_AVATAR_SESSION_KEY, String(Math.floor(Math.random() * USER_AVATAR_VARIANT_COUNT)));
        } catch (_) {}
      }

      function setMessage(text, type = "") {
        message.textContent = text;
        message.className = "login-message" + (type ? " " + type : "");
      }

      function getLoginErrorMessage(error) {
        const raw = String(error?.message || error || "");
        if (raw.includes("Failed to fetch") || raw.includes("NetworkError")) return "网络连接异常，请确认服务已启动后重试。";
        if (raw.includes("user not found") || raw.includes("invalid credentials") || raw.includes("invalid password")) return "账号或密码不正确，请检查后重试。";
        if (raw.includes("account disabled")) return "账号已停用，请联系管理员启用。";
        if (raw.includes("password not configured")) return "账号密码未初始化，请联系管理员重置。";
        if (raw.includes("encrypted password is invalid") || raw.includes("encrypted password is required")) return "密码传输加密失败，请刷新页面后重试。";
        if (raw.includes("password must be at least 6 characters and include a letter")) return "密码长度至少 6 位，且需包含至少 1 个字母。";
        if (raw.includes("admin password already configured")) return "管理员密码已初始化，请直接登录。";
        return raw || "登录失败，请稍后重试。";
      }

      async function apiAuth(path, options = {}) {
        const response = await fetch(path, {
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
          ...options,
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || `请求失败: ${response.status}`);
        return payload;
      }

      async function encryptPasswordForTransport(password) {
        return window.autoCheckCrypto.encryptPasswordForTransport(password, () => apiAuth("/api/auth/key"));
      }

      async function loadAuthState() {
        const state = await apiAuth("/api/auth/status");
        if (state.authenticated) {
          window.location.href = "/";
          return;
        }
        setupRequired = Boolean(state.setup_required);
        const titleText = setupRequired ? "初始化管理员密码" : "欢迎登录";
        const subtitleText = setupRequired ? "首次使用前，请设置一个至少 6 位且包含字母的管理员密码。" : "请输入账号和密码继续访问系统。";
        document.getElementById("loginTitle").textContent = titleText;
        document.getElementById("loginSubtitle").textContent = subtitleText;
        passwordInput.placeholder = setupRequired ? "管理员密码" : "请输入密码";
        confirmInput.placeholder = "再次输入密码";
        usernameInput.value = setupRequired ? "admin" : (usernameInput.value || loadRememberedUsername());
        usernameInput.readOnly = setupRequired;
        confirmGroup.hidden = !setupRequired;
        confirmInput.required = setupRequired;
        submitBtn.textContent = setupRequired ? "初始化并登录" : "登录";
      }

      passwordToggle.addEventListener("click", togglePasswordVisibility);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (loginSubmitting) return;
        const password = passwordInput.value;
        if (setupRequired && password !== confirmInput.value) {
          setMessage("两次输入的密码不一致。", "error");
          return;
        }
        if (!setupRequired && !usernameInput.value.trim()) {
          setMessage("请输入用户名。", "error");
          return;
        }
        if (!password) {
          setMessage("请输入密码。", "error");
          return;
        }
        let loginSucceeded = false;
        loginSubmitting = true;
        submitBtn.disabled = true;
        setMessage(setupRequired ? "正在初始化..." : "正在登录...");
        try {
          const encryptedPassword = await encryptPasswordForTransport(password);
          const username = setupRequired ? "admin" : usernameInput.value.trim();
          if (setupRequired) {
            await apiAuth("/api/auth/setup", {
              method: "POST",
              body: JSON.stringify({ password_encrypted: encryptedPassword }),
            });
          } else {
            await apiAuth("/api/auth/login", {
              method: "POST",
              body: JSON.stringify({ username, password_encrypted: encryptedPassword }),
            });
          }
          setMessage("登录成功，正在进入系统。", "success");
          if (!setupRequired) saveRememberedUsername(username);
          refreshUserAvatarVariant();
          loginSucceeded = true;
          try {
            sessionStorage.setItem(MAIN_ENTRY_ANIMATION_KEY, "login");
          } catch (_) {}
          window.location.href = "/";
        } catch (error) {
          setMessage(getLoginErrorMessage(error), "error");
        } finally {
          if (!loginSucceeded) {
            loginSubmitting = false;
            submitBtn.disabled = false;
          }
        }
      });

      forgotPasswordBtn.addEventListener("click", () => {
        setMessage("暂不支持找回密码，请联系系统管理员重置。", "error");
      });

      document.querySelectorAll(".social-btn").forEach((button) => {
        button.addEventListener("click", () => {
          setMessage(`${button.dataset.provider} 登录暂不支持。`, "error");
        });
      });

      applyTheme(localStorage.getItem("autoCheckLoginTheme") || "light");
      loadAuthState().catch((error) => setMessage(error.message, "error"));
    </script>
  </body>
</html>
