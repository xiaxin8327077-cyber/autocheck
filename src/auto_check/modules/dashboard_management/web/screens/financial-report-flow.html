<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金融监管报表报送流程大屏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-deep: #020617;
      --bg-panel: rgba(15, 23, 42, 0.88);
      --bg-card: rgba(15, 23, 42, 0.92);
      --blue: #38bdf8;
      --blue-light: #67e8f9;
      --blue-glow: rgba(56, 189, 248, 0.24);
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --gold-glow: rgba(245, 158, 11, 0.18);
      --cyan: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.18);
      --green: #10b981;
      --red: #ef4444;
      --text: #e5e7eb;
      --text-dim: #cbd5e1;
      --text-muted: #94a3b8;
      --border: rgba(34, 211, 238, 0.32);
      --border-gold: rgba(245, 158, 11, 0.35);
    }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(34, 211, 238, 0.16), transparent 30%),
        radial-gradient(circle at 88% 12%, rgba(56, 189, 248, 0.16), transparent 32%),
        linear-gradient(135deg, #020617 0%, #0f172a 52%, #111827 100%);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(34, 211, 238, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.08) 1px, transparent 1px);
      background-size: 42px 42px;
      pointer-events: none;
      z-index: 0;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px 16px 8px;
      position: relative;
      z-index: 1;
    }

    /* ====== Top Header ====== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      flex-shrink: 0;
      position: relative;
      padding: 0 20px;
    }
    .top-bar::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue), var(--cyan), var(--blue), transparent);
      opacity: 0.9;
    }
    .top-left { display: flex; align-items: center; gap: 14px; }
    .top-icon {
      width: 40px; height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 900; color: #02131f;
      box-shadow: 0 0 20px var(--cyan-glow);
    }
    .top-title { font-size: 26px; font-weight: 800; letter-spacing: 3px; }
    .top-title span { color: #f3f9ff; -webkit-text-fill-color: #f3f9ff; }
    .top-right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-dim); }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ====== Main Grid ====== */
    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      min-height: 0;
      margin-top: 8px;
    }

    .panel {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(2, 6, 23, 0.94));
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
    }
    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--blue), var(--blue-light));
    }
    .panel.gold::before { background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
    .panel.cyan::before { background: linear-gradient(90deg, var(--cyan), var(--blue-light)); }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-title::before {
      content: '';
      width: 3px; height: 16px;
      border-radius: 2px;
      background: var(--blue-light);
    }
    .panel.gold .panel-title::before { background: var(--gold-light); }
    .panel.cyan .panel-title::before { background: var(--cyan); }
    .panel-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--blue-light);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .panel.gold .panel-badge { background: rgba(245, 158, 11, 0.15); color: var(--gold-light); border-color: rgba(245, 158, 11, 0.3); }
    .panel-body {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .diagram-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ====== Center Flow Panel ====== */
    .center-flow {
      grid-row: span 2;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.9), rgba(2, 6, 23, 0.94));
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
    }
    .center-flow::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--blue), var(--cyan), var(--gold));
    }

    /* ====== SVG Shared ====== */
    .node-box { fill: rgba(59, 130, 246, 0.06); stroke: rgba(59, 130, 246, 0.4); stroke-width: 1.2; }
    .node-box-gold { fill: rgba(245, 158, 11, 0.06); stroke: rgba(245, 158, 11, 0.4); stroke-width: 1.2; }
    .node-hl { fill: rgba(59, 130, 246, 0.12); stroke: var(--blue); stroke-width: 1.6; }
    .node-hl-gold { fill: rgba(59, 130, 246, 0.12); stroke: var(--blue); stroke-width: 1.6; }
    .node-cyan { fill: rgba(34, 211, 238, 0.1); stroke: var(--cyan); stroke-width: 1.4; }
    .flow-line { stroke: rgba(59, 130, 246, 0.4); stroke-width: 1.2; fill: none; }
    .flow-line-gold { stroke: rgba(245, 158, 11, 0.4); stroke-width: 1.2; fill: none; }
    .flow-line-cyan { stroke: rgba(34, 211, 238, 0.4); stroke-width: 1.2; fill: none; }
    .flow-line-active { stroke: var(--blue); stroke-width: 1.6; fill: none; }
    .flow-line-active-gold { stroke: var(--blue); stroke-width: 1.6; fill: none; }
    .dot { fill: var(--blue); }
    .dot-gold { fill: var(--blue); }
    .dot-cyan { fill: var(--cyan); }
    .tag-box { fill: rgba(59, 130, 246, 0.06); stroke: rgba(59, 130, 246, 0.2); stroke-width: 0.8; }
    .tag-box-gold { fill: rgba(59, 130, 246, 0.06); stroke: rgba(59, 130, 246, 0.2); stroke-width: 0.8; }
    .glow-circle { fill: none; stroke: var(--blue); stroke-width: 1; opacity: 0.2; }
    .glow-circle-gold { fill: none; stroke: var(--gold); stroke-width: 1; opacity: 0.2; }
    .progress-bg { fill: rgba(59, 130, 246, 0.06); }
    .progress-fill { fill: var(--blue); }
    .progress-fill-gold { fill: var(--gold); }
    .progress-fill-cyan { fill: var(--cyan); }
    .grid-line { stroke: rgba(34, 211, 238, 0.26); stroke-width: 0.5; }
    .axis-text { fill: var(--text-muted); font-size: 8px; font-family: 'Microsoft YaHei', sans-serif; }
    .bar-blue { fill: var(--blue); opacity: 0.85; }
    .bar-gold { fill: var(--gold); opacity: 0.85; }
    .bar-cyan { fill: var(--cyan); opacity: 0.85; }
    .bar-blue-dim { fill: rgba(59, 130, 246, 0.3); }
    .bar-gold-dim { fill: rgba(245, 158, 11, 0.3); }
    .bar-cyan-dim { fill: rgba(34, 211, 238, 0.3); }
  </style>
</head>
<body>
<div class="screen">

  <!-- ====== TOP BAR ====== -->
  <div class="top-bar">
    <div class="top-title" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);"><span>金融监管报表报送流程大屏</span></div>
  </div>

  <!-- ====== MAIN GRID ====== -->
  <div class="main-grid">

    <!-- ====== LEFT TOP: 数据源接入 ====== -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">数据源接入</span>
        <span class="panel-badge">流程</span>
      </div>
      <div class="panel-body">
        <svg class="diagram-svg" viewBox="0 0 360 200" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="techGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
              <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.5"/>
              <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
            </linearGradient>
            <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:rgba(34,211,238,0.15)"/>
              <stop offset="100%" style="stop-color:rgba(59,130,246,0.05)"/>
            </linearGradient>
            <filter id="techGlow">
              <feGaussianBlur stdDeviation="2" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- Background tech grid -->
          <rect x="0" y="0" width="360" height="200" fill="url(#techGrad1)" opacity="0.1"/>
          <g opacity="0.15">
            <line x1="0" y1="40" x2="360" y2="40" stroke="#22d3ee" stroke-width="0.5"/>
            <line x1="0" y1="80" x2="360" y2="80" stroke="#22d3ee" stroke-width="0.5"/>
            <line x1="0" y1="120" x2="360" y2="120" stroke="#22d3ee" stroke-width="0.5"/>
            <line x1="0" y1="160" x2="360" y2="160" stroke="#22d3ee" stroke-width="0.5"/>
          </g>

          <!-- ====== Stage 1: 源系统 ====== -->
          <g transform="translate(10, 70)">
            <rect x="0" y="0" width="55" height="50" rx="6" fill="url(#nodeGrad)" stroke="var(--cyan)" stroke-width="1.2"/>
            <rect x="2" y="2" width="51" height="46" rx="5" fill="none" stroke="rgba(34,211,238,0.3)" stroke-width="0.5"/>
            <text x="27" y="30" text-anchor="middle" fill="var(--cyan)" font-size="12" font-weight="800">源系统</text>
            <circle cx="8" cy="8" r="2" fill="var(--cyan)" opacity="0.6"/>
            <circle cx="47" cy="8" r="2" fill="var(--cyan)" opacity="0.6"/>
          </g>

          <!-- Connection: 源系统 → 视图/源表 -->
          <path d="M65,85 L90,85" stroke="var(--cyan)" stroke-width="1.5" fill="none" stroke-dasharray="4 2" opacity="0.8"/>
          <path d="M65,105 L90,105" stroke="var(--blue)" stroke-width="1.5" fill="none" stroke-dasharray="4 2" opacity="0.8"/>
          <polygon points="87,82 92,85 87,88" fill="var(--cyan)"/>
          <polygon points="87,102 92,105 87,108" fill="var(--blue)"/>

          <!-- ====== Stage 2: 视图 ====== -->
          <g transform="translate(90, 45)">
            <rect x="0" y="0" width="55" height="32" rx="5" fill="url(#nodeGrad)" stroke="var(--cyan)" stroke-width="1.2" filter="url(#techGlow)"/>
            <text x="27" y="20" text-anchor="middle" fill="var(--cyan)" font-size="11" font-weight="700">视图</text>
          </g>

          <!-- ====== Stage 2: 源表 ====== -->
          <g transform="translate(90, 105)">
            <rect x="0" y="0" width="55" height="32" rx="5" fill="url(#nodeGrad)" stroke="var(--blue)" stroke-width="1.2" filter="url(#techGlow)"/>
            <text x="27" y="20" text-anchor="middle" fill="var(--blue)" font-size="11" font-weight="700">源表</text>
          </g>

          <!-- Connection: 视图/源表 → 数据中台 -->
          <path d="M145,61 Q155,61 155,80" stroke="var(--cyan)" stroke-width="1.5" fill="none" opacity="0.8"/>
          <path d="M145,121 Q155,121 155,102" stroke="var(--blue)" stroke-width="1.5" fill="none" opacity="0.8"/>
          <circle cx="155" cy="80" r="3" fill="var(--cyan)"/>
          <circle cx="155" cy="102" r="3" fill="var(--blue)"/>

          <!-- ====== Stage 3: 数据中台 ====== -->
          <g transform="translate(160, 50)">
            <!-- Outer glow ring -->
            <circle cx="50" cy="45" r="42" fill="none" stroke="url(#techGrad1)" stroke-width="1" stroke-dasharray="8 4" opacity="0.6">
              <animateTransform attributeName="transform" type="rotate" from="0 50 45" to="360 50 45" dur="20s" repeatCount="indefinite"/>
            </circle>
            <circle cx="50" cy="45" r="35" fill="rgba(6,182,212,0.08)" stroke="var(--cyan)" stroke-width="1.5"/>
            <circle cx="50" cy="45" r="28" fill="rgba(59,130,246,0.05)" stroke="var(--blue)" stroke-width="1" stroke-dasharray="4 2"/>
            <text x="50" y="48" text-anchor="middle" fill="var(--cyan)" font-size="13" font-weight="800">数据中台</text>
            <!-- Decorative dots -->
            <circle cx="50" cy="15" r="2" fill="var(--cyan)" opacity="0.6"/>
            <circle cx="78" cy="45" r="2" fill="var(--cyan)" opacity="0.6"/>
            <circle cx="22" cy="45" r="2" fill="var(--cyan)" opacity="0.6"/>
            <circle cx="50" cy="75" r="2" fill="var(--cyan)" opacity="0.6"/>
          </g>

          <!-- Connection: 数据中台 → 统一监管报送平台 -->
          <path d="M210,95 Q225,95 265,95" stroke="var(--cyan)" stroke-width="2" fill="none" opacity="0.9">
            <animate attributeName="stroke-dasharray" values="0 8 0;8 0 8" dur="2s" repeatCount="indefinite"/>
          </path>
          <polygon points="262,91 270,95 262,99" fill="var(--cyan)"/>

          <!-- ====== Stage 4: 统一监管报送平台 ====== -->
          <g transform="translate(278, 65)">
            <rect x="0" y="0" width="70" height="60" rx="8" fill="url(#nodeGrad)" stroke="var(--cyan)" stroke-width="1.5" filter="url(#techGlow)"/>
            <rect x="3" y="3" width="64" height="54" rx="6" fill="none" stroke="rgba(34,211,238,0.4)" stroke-width="0.5"/>
            <text x="35" y="25" text-anchor="middle" fill="var(--cyan)" font-size="9" font-weight="800">统一监管</text>
            <text x="35" y="42" text-anchor="middle" fill="var(--cyan)" font-size="9" font-weight="800">报送平台</text>
            <!-- Corner decorations -->
            <circle cx="8" cy="8" r="1.5" fill="var(--cyan)" opacity="0.5"/>
            <circle cx="62" cy="8" r="1.5" fill="var(--cyan)" opacity="0.5"/>
          </g>

          <!-- Bottom flow indicator -->
          <rect x="20" y="182" width="320" height="2" rx="1" fill="rgba(34,211,238,0.1)"/>
          <rect x="20" y="182" width="320" height="2" rx="1" fill="url(#techGrad1)"/>
          <text x="180" y="195" text-anchor="middle" fill="var(--text-muted)" font-size="9">数据处理链路</text>
        </svg>
      </div>
    </div>

    <!-- ====== CENTER: 主流程图 ====== -->
    <div class="center-flow">
      <div class="panel-header">
        <span class="panel-title">全流程自动化报送链路</span>
        <span class="panel-badge" style="color:#fff;background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.3);">链路</span>
      </div>
      <div class="panel-body">
        <svg class="diagram-svg" viewBox="0 0 420 640" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.6"/>
              <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:0.6"/>
              <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.6"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <g transform="translate(-30, 0)">
          <!-- Central pipeline spine with arrow -->
          <path d="M 240,20 L 248,20 Q 248,20 248,28 L 248,618 L 240,632 L 232,618 L 232,28 Q 232,20 240,20 Z" fill="url(#pipeGrad)" opacity="0.5"/>

          <!-- ====== Stage 1: 数据采集 ====== -->
          <g transform="translate(40, 30)">
            <rect class="node-hl" x="0" y="0" width="180" height="48" rx="6"/>
            <circle cx="24" cy="24" r="14" fill="rgba(59,130,246,0.2)" stroke="var(--blue)" stroke-width="1.5"/>
            <text x="24" y="28" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="800">1</text>
            <text x="50" y="20" fill="var(--text)" font-size="13" font-weight="700">数据采集</text>
            <text x="50" y="36" fill="var(--text-dim)" font-size="9">Tcmp·Ta· Ecif</text>
            <!-- Connector to spine -->
            <path class="flow-line-active" d="M180,24 L232,24"/>
            <circle cx="232" cy="24" r="4" class="dot" filter="url(#glow)"/>
          </g>

          <!-- ====== Stage 2: 补录生成 ====== -->
          <g transform="translate(40, 108)">
            <rect class="node-hl" x="0" y="0" width="180" height="48" rx="6"/>
            <circle cx="24" cy="24" r="14" fill="rgba(59,130,246,0.2)" stroke="var(--blue)" stroke-width="1.5"/>
            <text x="24" y="28" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="800">2</text>
            <text x="50" y="20" fill="var(--text)" font-size="13" font-weight="700">补录生成</text>
            <text x="50" y="36" fill="var(--text-dim)" font-size="9">人工录入 · 数据回填</text>
            <path class="flow-line-active" d="M180,24 L232,24"/>
            <circle cx="232" cy="24" r="4" class="dot" filter="url(#glow)"/>
          </g>

          <!-- ====== Stage 3: 智能对账 ====== -->
          <g transform="translate(40, 186)">
            <rect class="node-hl" x="0" y="0" width="180" height="48" rx="6"/>
            <circle cx="24" cy="24" r="14" fill="rgba(34,211,238,0.2)" stroke="var(--cyan)" stroke-width="1.5"/>
            <text x="24" y="28" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="800">3</text>
            <text x="50" y="20" fill="var(--text)" font-size="13" font-weight="700">智能对账</text>
            <text x="50" y="36" fill="var(--text-dim)" font-size="9">差异定位 · 平衡校验</text>
            <path class="flow-line-active" d="M180,24 L232,24"/>
            <circle cx="232" cy="24" r="4" class="dot-cyan" filter="url(#glow)"/>
          </g>

          <!-- ====== Stage 4: 报表生成 ====== -->
          <g transform="translate(40, 264)">
            <rect class="node-hl" x="0" y="0" width="180" height="48" rx="6"/>
            <circle cx="24" cy="24" r="14" fill="rgba(34,211,238,0.2)" stroke="var(--cyan)" stroke-width="1.5"/>
            <text x="24" y="28" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="800">4</text>
            <text x="50" y="20" fill="var(--text)" font-size="13" font-weight="700">报表生成</text>
            <text x="50" y="36" fill="var(--text-dim)" font-size="9">模板适配 · 批量导出</text>
            <path class="flow-line-active" d="M180,24 L232,24"/>
            <circle cx="232" cy="24" r="4" class="dot-cyan" filter="url(#glow)"/>
          </g>

          <!-- ====== Stage 5: 检验解决 ====== -->
          <g transform="translate(40, 342)">
            <rect class="node-hl-gold" x="0" y="0" width="180" height="48" rx="6"/>
            <circle cx="24" cy="24" r="14" fill="rgba(59,130,246,0.2)" stroke="var(--blue)" stroke-width="1.5"/>
            <text x="24" y="28" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="800">5</text>
            <text x="50" y="20" fill="var(--text)" font-size="13" font-weight="700">检验解决</text>
            <text x="50" y="36" fill="var(--text-dim)" font-size="9">问题修复 · 结果验证</text>
            <path class="flow-line-active-gold" d="M180,24 L232,24"/>
            <circle cx="232" cy="24" r="4" class="dot-gold" filter="url(#glow)"/>
          </g>

          <!-- ====== Stage 6: 数据治理 ====== -->
          <g transform="translate(40, 420)">
            <rect class="node-hl-gold" x="0" y="0" width="180" height="48" rx="6"/>
            <circle cx="24" cy="24" r="14" fill="rgba(59,130,246,0.2)" stroke="var(--blue)" stroke-width="1.5"/>
            <text x="24" y="28" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="800">6</text>
            <text x="50" y="20" fill="var(--text)" font-size="13" font-weight="700">数据治理</text>
            <text x="50" y="36" fill="var(--text-dim)" font-size="9">数据质量 · 标准规范</text>

<script>
  (function () {
    const svgNamespace = 'http://www.w3.org/2000/svg';

    function regionRows(payload, regionCode) {
      const region = payload?.data?.regions?.find((item) => item.code === regionCode);
      return region?.status === 'success' && Array.isArray(region.rows) ? region.rows : [];
    }

    function findPanel(title) {
      return Array.from(document.querySelectorAll('.panel')).find((panel) => panel.querySelector('.panel-title')?.textContent.trim() === title);
    }

    function svgNode(tag, attributes, text) {
      const element = document.createElementNS(svgNamespace, tag);
      Object.entries(attributes || {}).forEach(([name, value]) => element.setAttribute(name, String(value)));
      if (text !== undefined) element.textContent = String(text);
      return element;
    }

    function number(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatNumber(value) {
      return number(value).toLocaleString('zh-CN');
    }

    function renderReportCounts(rows) {
      const group = findPanel('监管报送报表数量')?.querySelector('svg g[transform="translate(40, 15)"]');
      if (!group) return;
      group.querySelectorAll('rect.bar-blue, rect.bar-cyan, text:not(.axis-text)').forEach((element) => element.remove());
      const data = rows.slice(0, 6);
      const max = Math.max(1, ...data.map((row) => number(row.report_count)));
      data.forEach((row, index) => {
        const x = 25 + index * 50;
        const height = Math.max(2, Math.round(number(row.report_count) / max * 145));
        group.append(
          svgNode('rect', { x, y: 155 - height, width: 15, height, rx: 2, class: index % 3 === 2 ? 'bar-cyan' : 'bar-blue' }),
          svgNode('text', { x: x + 8, y: Math.max(10, 149 - height), 'text-anchor': 'middle', fill: 'var(--blue-light)', 'font-size': 10, 'font-weight': 700 }, formatNumber(row.report_count)),
          svgNode('text', { x: x + 8, y: 187, 'text-anchor': 'middle', fill: 'var(--text-muted)', 'font-size': 9 }, row.report_type || ''),
        );
      });
    }

    function renderTable(title, rows, valueAlias, valueColor) {
      const body = findPanel(title)?.querySelector('svg g[transform="translate(16, 36)"]');
      if (!body) return;
      body.replaceChildren();
      rows.slice(0, 6).forEach((row, index) => {
        const y = index * 26;
        body.append(
          svgNode('rect', { x: 0, y, width: 328, height: 26, rx: 3, fill: index % 2 ? 'rgba(34,211,238,0.03)' : 'rgba(34,211,238,0.05)', stroke: 'rgba(34,211,238,0.15)', 'stroke-width': .8 }),
          svgNode('text', { x: 100, y: y + 17, 'text-anchor': 'middle', fill: 'var(--text)', 'font-size': 10 }, row.report_type || ''),
          svgNode('text', { x: 264, y: y + 17, 'text-anchor': 'middle', fill: valueColor, 'font-size': 12, 'font-weight': 700 }, valueAlias === 'validation_count' ? formatNumber(row[valueAlias]) : (row[valueAlias] || '-')),
        );
      });
    }

    function showError(message) {
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:99;background:rgba(127,29,29,.92);border:1px solid rgba(248,113,113,.8);border-radius:6px;color:#fee2e2;padding:10px 14px;font-size:13px;';
      toast.textContent = message;
      document.body.appendChild(toast);
    }

    async function loadDashboard() {
      const response = await fetch('/api/modules/dashboard-management/boards/reporting_process/preview', { headers: { Accept: 'application/json' } });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      if (!payload?.data?.regions) throw new Error(payload?.error?.message || '接口返回异常');
      const dataYear = Number(payload?.data?.data_year);
      if (!Number.isInteger(dataYear)) throw new Error('接口缺少有效的数据年度');
      document.documentElement.dataset.dataYear = String(dataYear);
      renderReportCounts(regionRows(payload, 'regulatory_report_count'));
      renderTable('当月监管报送报表时间', regionRows(payload, 'monthly_regulatory_report_time'), 'reporting_date', 'var(--cyan)');
      renderTable('报表校验统计', regionRows(payload, 'report_validation_statistics'), 'validation_count', 'var(--cyan)');
    }

    loadDashboard().catch((error) => showError(`数据接口加载失败：${error.message}`));
  })();
