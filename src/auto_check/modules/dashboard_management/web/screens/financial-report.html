<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金融监管报表报送大屏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      background: #020710;
      width: 100%;
      height: 100%;
      color: #f3f8ff;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(7, 18, 31, 0.28), rgba(3, 9, 19, 0.2)),
        radial-gradient(circle at 58% 22%, rgba(34, 211, 238, 0.07), transparent 31%),
        radial-gradient(circle at 83% 9%, rgba(139, 92, 246, 0.06), transparent 25%),
        linear-gradient(180deg, #071321 0%, #050d18 55%, #030913 100%);
      pointer-events: none;
      z-index: 0;
    }



    .dashboard {
      position: relative;
      width: 1500px;
      height: 840px;
      display: flex;
      flex-direction: column;
      z-index: 1;
      zoom: var(--dashboard-scale, 1);
      transform-origin: center center;
    }

    @supports not (zoom: 1) {
      .dashboard {
        transform: scale(var(--dashboard-scale, 1));
      }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 60px;
      background: linear-gradient(90deg, transparent, rgba(12, 32, 54, 0.5) 24%, rgba(12, 32, 54, 0.5) 76%, transparent);
      border: 0;
      border-top: 1px solid rgba(142, 166, 199, 0.1);
      margin-bottom: 12px;
      border-radius: 0;
    }

    .header::before {
      display: none;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 420px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.78), transparent);
      transform: translateX(-50%);
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #f3f9ff;
      letter-spacing: 0;
      text-shadow: 0 1px 2px rgba(2, 7, 16, 0.9), 0 0 7px rgba(56, 189, 248, 0.12);
    }

    .top-row {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
      flex: 0 0 140px;
    }

    .card {
      --panel-accent: #3b82f6;
      background: linear-gradient(180deg, rgba(12, 31, 52, 0.98), rgba(8, 24, 41, 0.98));
      border: 1px solid rgba(142, 166, 199, 0.16);
      border-radius: 8px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: none;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--panel-accent), transparent 60%);
      opacity: 0.82;
    }

    .card:hover {
      border-color: rgba(142, 166, 199, 0.16);
      box-shadow: none;
      transform: none;
    }

    .top-row .card:nth-child(2),
    .middle-row .chart-card:first-child,
    .bottom-row .chart-card {
      --panel-accent: #22d3ee;
    }

    .top-row .card:nth-child(3),
    .bottom-row .card {
      --panel-accent: #8b5cf6;
    }

    .card-title {
      font-size: 14px;
      color: #c8d8eb;
      margin-bottom: 15px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .total-sales {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .total-sales .value {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(180deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-top: 8px;
    }

    .total-sales .unit {
      font-size: 16px;
      color: #90a5bf;
      margin-left: 8px;
      font-weight: 600;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      color: #a9bdd6;
      font-weight: 700;
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid rgba(142, 166, 199, 0.16);
      background: rgba(5, 15, 27, 0.26);
    }

    .data-table td {
      padding: 14px 12px;
      text-align: center;
      color: #d2e0f1;
      font-weight: 600;
      border-bottom: 1px solid rgba(142, 166, 199, 0.08);
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr:hover td {
      background: rgba(34, 211, 238, 0.04);
    }

    .data-table .time-col {
      color: #8cc8ff;
      font-weight: 700;
    }

    .monthly-project-card {
      padding: 10px 12px;
    }

    .monthly-project-table {
      --monthly-row-height: 28px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    .monthly-project-table thead,
    .monthly-project-table tbody,
    .monthly-project-table tr {
      display: table;
      width: 100%;
      table-layout: fixed;
    }

    .monthly-project-table tbody {
      display: block;
      height: calc(var(--monthly-row-height) * 3);
      overflow: hidden;
      scroll-behavior: smooth;
    }

    .monthly-project-table tbody tr {
      height: var(--monthly-row-height);
    }

    .monthly-project-table th {
      padding: 6px 8px;
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .monthly-project-table td {
      height: var(--monthly-row-height);
      padding: 0 8px;
      line-height: var(--monthly-row-height);
      vertical-align: middle;
    }

    .target-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .target-card .value {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 8px 0;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 7px;
      overflow: hidden;
      position: relative;
      margin-top: 12px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #f59e0b);
      border-radius: 6px;
      position: relative;
    }

    .progress-label {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: #1f2937;
      font-weight: 700;
    }

    .middle-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
      flex: 0 0 270px;
      min-height: 0;
    }

    .chart-card {
      --panel-accent: #22d3ee;
      background: linear-gradient(180deg, rgba(12, 31, 52, 0.98), rgba(8, 24, 41, 0.98));
      border: 1px solid rgba(142, 166, 199, 0.16);
      border-radius: 8px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
      box-shadow: none;
      display: flex;
      flex-direction: column;
    }

    .chart-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--panel-accent), transparent 60%);
      opacity: 0.82;
    }

    .chart-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      min-height: 28px;
      flex-shrink: 0;
    }

    .chart-header::before {
      content: '';
      width: 4px;
      height: 16px;
      background: linear-gradient(180deg, #22d3ee, #38bdf8);
      border-radius: 2px;
    }

    .chart-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: #f1f7ff;
    }

    .chart-legend {
      display: flex;
      gap: 18px;
      margin-left: auto;
      font-size: 12px;
      font-weight: 600;
      color: #b8cadf;
    }

    .chart-legend .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #f59e0b;
      margin-right: 6px;
      vertical-align: middle;
      border-radius: 2px;
    }

    .chart-legend .dot.blue {
      background: #3b82f6;
    }

    .chart-legend .dot.red {
      background: #ef4444;
    }

    .chart-legend .dot.green {
      background: #22c55e;
    }

    .chart-svg {
      width: 100%;
      flex: 1;
      min-height: 0;
      text-rendering: geometricPrecision;
      shape-rendering: geometricPrecision;
    }

    .bottom-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .bottom-row > .card {
      display: flex;
      flex-direction: column;
    }

    .quarter-table {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .quarter-row {
      display: grid;
      grid-template-columns: 40% 60%;
      gap: 0;
      border: 1px solid rgba(142, 166, 199, 0.16);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(6, 20, 35, 0.42);
    }

    .quarter-row .label {
      background: rgba(5, 15, 27, 0.26);
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a9bdd6;
      font-size: 15px;
      font-weight: 600;
      border-right: 1px solid rgba(142, 166, 199, 0.08);
    }

    .quarter-row .value {
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d2e0f1;
      font-size: 16px;
      font-weight: 700;
    }

    .grid-line {
      stroke: rgba(142, 166, 199, 0.16);
      stroke-dasharray: 4 4;
    }

    .axis-text {
      fill: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    }

    .axis-text-month {
      fill: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    }

    .report-axis-label {
      font-size: 12px;
    }

    .line-path {
      fill: none;
      stroke: #f59e0b;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .line-point {
      fill: #f59e0b;
      stroke: rgba(255, 255, 255, 0.8);
      stroke-width: 2;
    }

    .bar {
      fill: url(#barGradient);
    }

    .bar-pink {
      fill: url(#barGradientPink);
    }

    .bar-value-label {
      fill: #f2f8ff;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      font-size: 12px;
      font-weight: 800;
      paint-order: stroke;
      stroke: #071321;
      stroke-linejoin: round;
      stroke-width: 3px;
      text-anchor: middle;
    }

    .area-blue {
      fill: url(#areaGradientBlue);
    }

    .area-orange {
      fill: url(#areaGradientOrange);
    }

    .line-blue {
      fill: none;
      stroke: #3b82f6;
      stroke-width: 2.5;
    }

    .line-orange {
      fill: none;
      stroke: #f59e0b;
      stroke-width: 2.5;
    }

    .tooltip-box {
      fill: rgba(8, 24, 41, 0.98);
      stroke: rgba(142, 166, 199, 0.28);
    }

  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>金融监管报表报送大屏</h1>
    </div>

    <div class="top-row">
      <div class="card total-sales">
        <div class="card-title">本年度完成补录任务</div>
        <div>
          <span class="value">1000</span><span class="unit">个</span>
        </div>
      </div>

      <div class="card monthly-project-card">
        <table class="data-table monthly-project-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>单一信托项目（个数）</th>
              <th>集合信托项目（个数）</th>
              <th>财产权信托项目（个数）</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="time-col">1月</td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td class="time-col">2月</td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td class="time-col">3月</td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card target-card">
        <div class="card-title">当月报表检验还剩</div>
        <div>
          <span class="value">60</span><span class="unit">个</span>
        </div>
      </div>
    </div>

    <div class="middle-row">
      <div class="chart-card">
        <div class="chart-header">
          <h3>报表对账完成时间</h3>
          <div class="chart-legend">
            <span><span class="dot"></span>完成时间</span>
          </div>
        </div>
        <svg class="chart-svg" viewBox="0 0 860 220" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
            </linearGradient>
            <filter id="glowLine">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g class="grid">
            <line class="grid-line" x1="62" y1="18" x2="830" y2="18"/>
            <line class="grid-line" x1="62" y1="56" x2="830" y2="56"/>
            <line class="grid-line" x1="62" y1="94" x2="830" y2="94"/>
            <line class="grid-line" x1="62" y1="132" x2="830" y2="132"/>
            <line class="grid-line" x1="62" y1="170" x2="830" y2="170"/>
          </g>
          <g>
            <text class="axis-text" x="54" y="22" text-anchor="end">01:00</text>
            <text class="axis-text" x="54" y="60" text-anchor="end">23:00</text>
            <text class="axis-text" x="54" y="98" text-anchor="end">21:00</text>
            <text class="axis-text" x="54" y="136" text-anchor="end">19:00</text>
            <text class="axis-text" x="54" y="174" text-anchor="end">17:00</text>
          </g>
          <path class="line-path" filter="url(#glowLine)"
                d="M 90 104 L 155 90 L 220 56 L 285 122 L 350 99 L 415 108 L 480 90 L 545 113 L 610 95 L 675 108 L 740 99 L 805 104"/>
          <circle class="line-point" cx="90" cy="104" r="4"/>
          <circle class="line-point" cx="155" cy="90" r="4"/>
          <circle class="line-point" cx="220" cy="56" r="4"/>
          <circle class="line-point" cx="285" cy="122" r="4"/>
          <circle class="line-point" cx="350" cy="99" r="4"/>
          <circle class="line-point" cx="415" cy="108" r="4"/>
          <circle class="line-point" cx="480" cy="90" r="4"/>
          <circle class="line-point" cx="545" cy="113" r="4"/>
          <circle class="line-point" cx="610" cy="95" r="4"/>
          <circle class="line-point" cx="675" cy="108" r="4"/>
          <circle class="line-point" cx="740" cy="99" r="4"/>
          <circle class="line-point" cx="805" cy="104" r="4"/>
          <g>
            <text class="axis-text-month" x="90" y="204" text-anchor="middle">1月</text>
            <text class="axis-text-month" x="155" y="204" text-anchor="middle">2月</text>
            <text class="axis-text-month" x="220" y="204" text-anchor="middle">3月</text>
            <text class="axis-text-month" x="285" y="204" text-anchor="middle">4月</text>
            <text class="axis-text-month" x="350" y="204" text-anchor="middle">5月</text>
            <text class="axis-text-month" x="415" y="204" text-anchor="middle">6月</text>
            <text class="axis-text-month" x="480" y="204" text-anchor="middle">7月</text>
            <text class="axis-text-month" x="545" y="204" text-anchor="middle">8月</text>
            <text class="axis-text-month" x="610" y="204" text-anchor="middle">9月</text>
            <text class="axis-text-month" x="675" y="204" text-anchor="middle">10月</text>
            <text class="axis-text-month" x="740" y="204" text-anchor="middle">11月</text>
            <text class="axis-text-month" x="805" y="204" text-anchor="middle">12月</text>
          </g>
        </svg>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <h3>报表校验问题处理</h3>
          <div class="chart-legend">
            <span><span class="dot blue"></span>个数</span>
          </div>
        </div>
        <svg class="chart-svg" viewBox="0 0 860 220" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.9" />
            </linearGradient>
            <linearGradient id="barGradientPink" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#9d174d;stop-opacity:0.8" />
            </linearGradient>
          </defs>
          <g class="grid">
            <line class="grid-line" x1="62" y1="18" x2="830" y2="18"/>
            <line class="grid-line" x1="62" y1="50" x2="830" y2="50"/>
            <line class="grid-line" x1="62" y1="82" x2="830" y2="82"/>

          </g>
          <g>
            <text class="axis-text" x="54" y="22" text-anchor="end">100</text>
            <text class="axis-text" x="54" y="54" text-anchor="end">80</text>
            <text class="axis-text" x="54" y="86" text-anchor="end">60</text>
            <text class="axis-text" x="54" y="118" text-anchor="end">40</text>
            <text class="axis-text" x="54" y="150" text-anchor="end">20</text>
            <text class="axis-text" x="54" y="182" text-anchor="end">0</text>
          </g>
          <g>
            <rect class="bar" x="82" y="42" width="18" height="136" rx="3"/>
            <rect class="bar" x="147" y="66" width="18" height="112" rx="3"/>
            <rect class="bar" x="212" y="34" width="18" height="144" rx="3"/>
            <rect class="bar" x="277" y="98" width="18" height="80" rx="3"/>
            <rect class="bar" x="342" y="58" width="18" height="120" rx="3"/>
            <rect class="bar" x="407" y="114" width="18" height="64" rx="3"/>
            <rect class="bar" x="472" y="82" width="18" height="96" rx="3"/>
            <rect class="bar" x="537" y="50" width="18" height="128" rx="3"/>
            <rect class="bar" x="602" y="74" width="18" height="104" rx="3"/>
            <rect class="bar" x="667" y="106" width="18" height="72" rx="3"/>
            <rect class="bar" x="732" y="90" width="18" height="88" rx="3"/>
            <rect class="bar" x="797" y="66" width="18" height="112" rx="3"/>
          </g>
          <g class="bar-value-labels" aria-hidden="true">
            <text class="bar-value-label" x="91" y="36">85</text>
            <text class="bar-value-label" x="156" y="60">70</text>
            <text class="bar-value-label" x="221" y="28">90</text>
            <text class="bar-value-label" x="286" y="92">50</text>
            <text class="bar-value-label" x="351" y="52">75</text>
            <text class="bar-value-label" x="416" y="108">40</text>
            <text class="bar-value-label" x="481" y="76">60</text>
            <text class="bar-value-label" x="546" y="44">80</text>
            <text class="bar-value-label" x="611" y="68">65</text>
            <text class="bar-value-label" x="676" y="100">45</text>
            <text class="bar-value-label" x="741" y="84">55</text>
            <text class="bar-value-label" x="806" y="60">70</text>
          </g>
          <g>
            <text class="axis-text-month" x="91" y="204" text-anchor="middle">1月</text>
            <text class="axis-text-month" x="156" y="204" text-anchor="middle">2月</text>
            <text class="axis-text-month" x="221" y="204" text-anchor="middle">3月</text>
            <text class="axis-text-month" x="286" y="204" text-anchor="middle">4月</text>

          <g class="grid">

            <text class="axis-text-month" x="686" y="260" text-anchor="middle">East5</text>

  </div>
  <script>
    (function () {
      const designWidth = 1500;
      const designHeight = 840;
      const viewportPadding = 24;
      const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

      function updateDashboardScale() {
        const availableWidth = Math.max(320, window.innerWidth - viewportPadding);
        const availableHeight = Math.max(240, window.innerHeight - viewportPadding);
        const scale = Math.min(availableWidth / designWidth, availableHeight / designHeight);
        document.documentElement.style.setProperty('--dashboard-scale', scale.toFixed(4));
      }

      function toList(value) {
        return Array.isArray(value) ? value : [];
      }

      function toNumber(value) {
        const number = Number(String(value == null ? '' : value).replace(/[^\d.-]/g, ''));
        return Number.isFinite(number) ? number : 0;
      }

      function formatNumber(value) {
        return toNumber(value).toLocaleString('zh-CN');
      }

      function setText(selector, value) {
        const element = document.querySelector(selector);
        if (element) {
          element.textContent = value;
        }
      }

      function hasDataValue(value) {
        return value !== null && value !== undefined && String(value).trim() !== '';
      }

      function formatOptionalNumber(value) {
        return hasDataValue(value) ? formatNumber(value) : '';
      }

      function normalizeTrustRows(rows) {
        const byMonth = new Map();
        toList(rows).forEach((row) => byMonth.set(row.month, row));
        return months.map((month) => byMonth.get(month) || {
          month,
          singleTrustCount: null,
          collectiveTrustCount: null,
          propertyTrustCount: null,
        });
      }

      function hasTrustProjectData(row) {
        return row
          && hasDataValue(row.month || row.period)
          && (
            hasDataValue(row.singleTrustCount)
            || hasDataValue(row.collectiveTrustCount)
            || hasDataValue(row.propertyTrustCount)
          );
      }

      function latestRowsWithValue(rows, valueKey) {
        return toList(rows)
          .filter((row) => row && hasDataValue(row.month) && hasDataValue(row[valueKey]))
          .slice(-12);
      }

      function updateMonthLabels(svg, data, xForIndex) {
        const labels = svg.querySelectorAll('.axis-text-month');
        labels.forEach((label, index) => {
          const row = data[index];
          if (!row) {
            label.textContent = '';
            label.setAttribute('display', 'none');
            return;
          }
          label.removeAttribute('display');
          label.textContent = row.month || '';
          label.setAttribute('x', String(Math.round(xForIndex(index))));
        });
      }

      function startRowScroller(tbody, visibleRows) {
        const oldTimer = tbody.dataset.scrollTimer;
        if (oldTimer) {
          window.clearInterval(Number(oldTimer));
          delete tbody.dataset.scrollTimer;
        }
        const rows = Array.from(tbody.querySelectorAll('tr'));
        tbody.scrollTop = 0;
        if (!rows.length) {
          return;
        }
        const configuredRowHeight = Number.parseFloat(getComputedStyle(tbody).getPropertyValue('--monthly-row-height'));
        const rowHeight = Math.round(configuredRowHeight || rows[0].getBoundingClientRect().height || 28);
        tbody.style.height = `${rowHeight * Math.min(visibleRows, rows.length)}px`;
        if (rows.length <= visibleRows) {
          return;
        }
        let index = 0;
        const maxIndex = rows.length - visibleRows;
        const timer = window.setInterval(() => {
          index = index >= maxIndex ? 0 : index + 1;
          tbody.scrollTo({ top: index * rowHeight, behavior: 'smooth' });
        }, 4200);
        tbody.dataset.scrollTimer = String(timer);
      }

      function parseHour(value) {
        const text = String(value == null ? '' : value).trim();
        const match = text.match(/(\d{1,2})(?::\d{1,2})?/);
        if (!match) {
          return 17;
        }
        let hour = Number(match[1]);
        if (!Number.isFinite(hour)) {
          return 17;
        }
        if (hour >= 0 && hour <= 2) {
          hour += 24;
        }
        return Math.max(17, Math.min(25, hour));
      }

      function parseDay(value) {
        const text = String(value == null ? '' : value).trim();
        if (!text) {
          return null;
        }
        const dateMatch = text.match(/\d{4}-\d{1,2}-(\d{1,2})/);
        if (dateMatch) {
          return Number(dateMatch[1]);
        }
        const numberMatch = text.match(/(\d{1,2})/);
        if (numberMatch) {
          return Number(numberMatch[1]);
        }
        return null;
      }

      function renderMonthlyTrustProjects(rows) {
        const tbody = document.querySelector('.top-row .data-table tbody');
        if (!tbody) {
          return;
        }
        const data = normalizeTrustRows(rows).filter(hasTrustProjectData);
        tbody.innerHTML = data.map((row) => `
          <tr>
            <td class="time-col">${row.month || row.period || ''}</td>
            <td>${formatOptionalNumber(row.singleTrustCount)}</td>
            <td>${formatOptionalNumber(row.collectiveTrustCount)}</td>
            <td>${formatOptionalNumber(row.propertyTrustCount)}</td>
          </tr>
        `).join('');
        startRowScroller(tbody, 3);
      }

      function renderReconciliation(rows) {
        const svg = document.querySelectorAll('.middle-row .chart-svg')[0];
        if (!svg) {
          return;
        }
        const left = 90;
        const right = 805;
        const top = 18;
        const bottom = 170;
        const data = latestRowsWithValue(rows, 'value');
        const step = data.length > 1 ? (right - left) / (data.length - 1) : 0;
        const xForIndex = (index) => data.length > 1 ? left + index * step : (left + right) / 2;
        const points = data.map((row, index) => {
          const x = xForIndex(index);
          const y = bottom - ((parseHour(row.value) - 17) / 8) * (bottom - top);
          return { x: Math.round(x), y: Math.max(top, Math.min(bottom, Math.round(y))) };
        });
        const path = svg.querySelector('.line-path');
        if (path) {
          path.setAttribute('d', points.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x} ${point.y}`).join(' '));
        }
        const existingPoints = svg.querySelectorAll('.line-point');
        points.forEach((point, index) => {
          const circle = existingPoints[index];
          if (circle) {
            circle.setAttribute('cx', String(point.x));
            circle.setAttribute('cy', String(point.y));
            circle.removeAttribute('display');
          }
        });
        existingPoints.forEach((circle, index) => {
          if (index >= points.length) {
            circle.setAttribute('display', 'none');
          }
        });
        updateMonthLabels(svg, data, xForIndex);
      }

      function renderValidationIssues(rows) {
        const svg = document.querySelectorAll('.middle-row .chart-svg')[1];
        if (!svg) {
          return;
        }
        const top = 18;
        const bottom = 178;
        const left = 82;
        const right = 815;
        const data = latestRowsWithValue(rows, 'count');
        const step = data.length > 1 ? (right - left) / (data.length - 1) : 0;
        const barWidth = data.length > 8 ? 18 : 24;
        const xForIndex = (index) => data.length > 1 ? left + index * step : (left + right) / 2;
        const max = Math.max(100, ...data.map((row) => toNumber(row.count)));
        const axisLabels = svg.querySelectorAll('.axis-text');
        axisLabels.forEach((label, index) => {
          label.textContent = String(Math.round(max * (1 - index / 5)));
        });
        const bars = svg.querySelectorAll('.bar');
        const valueLabels = svg.querySelector('.bar-value-labels');
        data.forEach((row, index) => {
          const bar = bars[index];
          if (!bar) {
            return;
          }
          const height = Math.max(1, (toNumber(row.count) / max) * (bottom - top));
          bar.setAttribute('x', String(Math.round(xForIndex(index) - barWidth / 2)));
          bar.setAttribute('width', String(barWidth));
          bar.setAttribute('y', String(bottom - height));
          bar.setAttribute('height', String(height));
          bar.removeAttribute('display');
        });
        bars.forEach((bar, index) => {
          if (index >= data.length) {
            bar.setAttribute('display', 'none');
          }
        });
        if (valueLabels) {
          valueLabels.innerHTML = data.map((row, index) => {
            const count = toNumber(row.count);
            const height = Math.max(1, (count / max) * (bottom - top));
            const x = Math.round(xForIndex(index));
            const y = Math.max(13, bottom - height - 6);
            return `<text class="bar-value-label" x="${x}" y="${y}">${formatNumber(count)}</text>`;
          }).join('');
        }
        updateMonthLabels(svg, data, xForIndex);
      }

      function renderQuarterRows(rows) {
        const table = document.querySelector('.quarter-table');
        if (!table) {
          return;
        }
        const data = toList(rows).length ? toList(rows) : [
          { quarter: '第1季度', count: 0 },
          { quarter: '第2季度', count: 0 },
          { quarter: '第3季度', count: 0 },
          { quarter: '第4季度', count: 0 },
        ];
        table.innerHTML = `
          <div class="quarter-row">
            <div class="label">季度</div>
            <div class="label">问题（个数）</div>
          </div>
          ${data.map((row) => `
            <div class="quarter-row">
              <div class="label">${row.quarter || ''}</div>
              <div class="value">${formatNumber(row.count)}</div>
            </div>
          `).join('')}
        `;
      }

      function submissionGroupX(index, count) {
        const firstGroupX = 96;
        const lastGroupX = 806;
        if (count <= 1) {
          return (firstGroupX + lastGroupX) / 2;
        }
        return firstGroupX + (lastGroupX - firstGroupX) * index / (count - 1);
      }

      function renderSubmissionCompare(rows) {
        const svg = document.querySelector('.bottom-row .chart-card .chart-svg');
        if (!svg) {
          return;
        }
        const data = toList(rows).slice(0, 6);
        const groups = svg.querySelectorAll(':scope > g');
        const barGroup = groups[2];
        const labelGroup = groups[3];
        if (!barGroup || !labelGroup) {
          return;
        }
        function bar(day) {
          if (!Number.isFinite(day) || day <= 0) {
            return null;
          }
          const safeDay = Math.max(1, Math.min(20, day));
          const y = Math.max(22, Math.min(230, 230 - safeDay * 10.4));
          return { y, height: 230 - y, labelY: y - 7 };
        }
        barGroup.innerHTML = data.map((row, index) => {
          const actualDay = parseDay(row.actualOutputDate);
          const requiredDay = parseDay(row.requiredSubmissionDate);
          const actual = bar(actualDay);
          const required = bar(requiredDay);
          const x = submissionGroupX(index, data.length);
          return [
            actual ? `
              <rect fill="url(#barGradientAct)" x="${x}" y="${actual.y}" width="18" height="${actual.height}" rx="3"/>
              <text x="${x + 9}" y="${actual.labelY}" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="800">${actualDay}号</text>
            ` : '',
            required ? `
              <rect fill="url(#barGradientReq)" x="${x + 28}" y="${required.y}" width="18" height="${required.height}" rx="3"/>
              <text x="${x + 37}" y="${required.labelY}" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="800">${requiredDay}号</text>
            ` : '',
          ].join('');
        }).join('');
        labelGroup.innerHTML = data.map((row, index) => {
          const x = submissionGroupX(index, data.length) + 22;
          return `<text class="axis-text-month" x="${x}" y="260" text-anchor="middle">${row.reportType || ''}</text>`;
        }).join('');
      }

      function showError(message) {
        let toast = document.querySelector('.regreport-error-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.className = 'regreport-error-toast';
          toast.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:99;background:rgba(127,29,29,.92);border:1px solid rgba(248,113,113,.8);border-radius:6px;color:#fee2e2;padding:10px 14px;font-size:13px;';
          document.body.appendChild(toast);
        }
        toast.textContent = message;
      }

      function regionRows(payload, regionCode) {
        const region = payload?.data?.regions?.find((item) => item.code === regionCode);
        if (!region || region.status !== 'success') {
          return [];
        }
        return toList(region.rows);
      }

      async function loadDashboard() {
        const response = await fetch('/api/modules/dashboard-management/boards/report_submission/preview', { headers: { Accept: 'application/json' } });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const payload = await response.json();
        if (!payload?.data?.regions) {
          throw new Error(payload?.error?.message || '接口返回异常');
        }
        const dataYear = Number(payload?.data?.data_year);
        if (!Number.isInteger(dataYear)) {
          throw new Error('接口缺少有效的数据年度');
        }
        document.documentElement.dataset.dataYear = String(dataYear);
        const supplement = regionRows(payload, 'annual_supplement_completed')[0] || {};
        const remaining = regionRows(payload, 'monthly_report_validation_remaining')[0] || {};
        setText('.total-sales .value', formatNumber(supplement.completed_supplement_count));
        setText('.target-card .value', formatNumber(remaining.remaining_validation_count));
        renderMonthlyTrustProjects(regionRows(payload, 'monthly_trust_projects').map((row) => ({
          month: row.month,
          singleTrustCount: row.single_trust_count,
          collectiveTrustCount: row.collective_trust_count,
          propertyTrustCount: row.property_trust_count,
        })));
        renderReconciliation(regionRows(payload, 'report_reconciliation_completion_time').map((row) => ({ month: row.month, value: row.reconciliation_completed_time })));
        renderValidationIssues(regionRows(payload, 'report_validation_issue_handling').map((row) => ({ month: row.month, count: row.validation_issue_count })));
        renderQuarterRows(regionRows(payload, 'quarterly_special_processing').map((row) => ({ quarter: row.quarter, count: row.special_processing_count })));
        renderSubmissionCompare(regionRows(payload, 'monthly_report_submission_time_comparison').map((row) => ({
          reportType: row.report_type,
          actualOutputDate: row.actual_report_generated_at,
          requiredSubmissionDate: row.required_submission_at,
        })));
      }

      document.addEventListener('DOMContentLoaded', () => {
        updateDashboardScale();
        window.addEventListener('resize', updateDashboardScale);
        loadDashboard().catch((error) => showError(`数据接口加载失败：${error.message}`));
      });
    })();
  </script>
