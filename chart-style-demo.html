<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图表样式方案对比</title>
<style>
  :root {
    --bg: #f7fafc;
    --card: #fff;
    --text: #181c1e;
    --sub: #43474b;
    --border: #e0e3e5;
    --teal: #25676e;
    --teal-light: #abeaf2;
  }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .section { display: flex; flex-direction: column; gap: 12px; }
  .section h2 {
    font-size: 20px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    font-size: 12px;
    font-weight: 500;
    padding: 2px 10px;
    border-radius: 999px;
    background: #e6f4ea;
    color: #137333;
  }
  .badge.rec { background: #ceead6; color: #0d5e1a; }
  .desc {
    color: var(--sub);
    font-size: 13px;
    margin: 0 0 8px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 15px;
  }
  .card-header .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chart-wrap {
    padding: 16px 10px;
    display: flex;
    justify-content: center;
  }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>

<!-- ======== 方案 A ======== -->
<div class="section">
  <h2><span class="badge rec">推荐</span> 方案 A：渐变面积 + 微光</h2>
  <p class="desc">折线下半透明渐变填充、圆点带白色外环光晕、细化网格线</p>
  <div class="card">
    <div class="card-header">
      <span class="dot" style="background:#25676e"></span> 最新趋势
      <span style="font-weight:400;font-size:12px;color:var(--sub);margin-left:auto">2025-05-31 | 共 6 次执行</span>
    </div>
    <div class="chart-wrap"><svg viewBox="0 0 680 280" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="areaGradA" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#25676e" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#25676e" stop-opacity="0.02"/>
        </linearGradient>
        <filter id="glowA">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Grid -->
      <g stroke="#e0e3e5" stroke-dasharray="4 6" stroke-width="0.8">
        <line x1="70" y1="40" x2="660" y2="40"/>
        <line x1="70" y1="120" x2="660" y2="120"/>
        <line x1="70" y1="200" x2="660" y2="200"/>
      </g>
      <!-- Axes -->
      <line x1="70" y1="30" x2="70" y2="230" stroke="#c4c7cc" stroke-width="1"/>
      <line x1="70" y1="230" x2="660" y2="230" stroke="#c4c7cc" stroke-width="1"/>
      <!-- Y ticks -->
      <text x="60" y="44" text-anchor="end" font-size="11" fill="#74777c">120</text>
      <text x="60" y="124" text-anchor="end" font-size="11" fill="#74777c">60</text>
      <text x="60" y="204" text-anchor="end" font-size="11" fill="#74777c">0</text>
      <!-- X labels -->
      <text x="70" y="248" text-anchor="middle" font-size="11" fill="#43474b">10:30</text>
      <text x="188" y="248" text-anchor="middle" font-size="11" fill="#43474b">11:45</text>
      <text x="306" y="248" text-anchor="middle" font-size="11" fill="#43474b">14:00</text>
      <text x="424" y="248" text-anchor="middle" font-size="11" fill="#43474b">15:20</text>
      <text x="542" y="248" text-anchor="middle" font-size="11" fill="#43474b">16:30</text>
      <text x="660" y="248" text-anchor="middle" font-size="11" fill="#43474b">17:45</text>
      <!-- Area fill -->
      <polygon points="70,180 188,140 306,95 424,118 542,72 660,60 660,230 70,230" fill="url(#areaGradA)"/>
      <!-- Line -->
      <polyline points="70,180 188,140 306,95 424,118 542,72 660,60" fill="none" stroke="#25676e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Dots with glow ring -->
      <circle cx="70" cy="180" r="5" fill="#25676e" stroke="#fff" stroke-width="2.5" filter="url(#glowA)"/>
      <circle cx="188" cy="140" r="5" fill="#25676e" stroke="#fff" stroke-width="2.5" filter="url(#glowA)"/>
      <circle cx="306" cy="95" r="5" fill="#25676e" stroke="#fff" stroke-width="2.5" filter="url(#glowA)"/>
      <circle cx="424" cy="118" r="5" fill="#25676e" stroke="#fff" stroke-width="2.5" filter="url(#glowA)"/>
      <circle cx="542" cy="72" r="5" fill="#25676e" stroke="#fff" stroke-width="2.5" filter="url(#glowA)"/>
      <circle cx="660" cy="60" r="5" fill="#25676e" stroke="#fff" stroke-width="2.5" filter="url(#glowA)"/>
      <!-- Labels above dots -->
      <text x="70" y="169" text-anchor="middle" font-size="11" fill="#43474b" font-weight="600">12</text>
      <text x="188" y="129" text-anchor="middle" font-size="11" fill="#43474b" font-weight="600">18</text>
      <text x="306" y="84" text-anchor="middle" font-size="11" fill="#43474b" font-weight="600">25</text>
      <text x="424" y="107" text-anchor="middle" font-size="11" fill="#43474b" font-weight="600">20</text>
      <text x="542" y="61" text-anchor="middle" font-size="11" fill="#43474b" font-weight="600">30</text>
      <text x="660" y="49" text-anchor="middle" font-size="11" fill="#43474b" font-weight="600">36</text>
    </svg></div>
  </div>
</div>

<!-- ======== 方案 B ======== -->
<div class="section">
  <h2><span class="badge">方案 B</span> 暗色水晶仪表</h2>
  <p class="desc">深色毛玻璃背景 + 荧光青发光线条 + 圆点脉冲动效</p>
  <div class="card" style="background:#0f1923;border-color:#1a2a3a;">
    <div class="card-header" style="border-color:#1a2a3a;color:#e1e3e5;">
      <span class="dot" style="background:#00e5ff;box-shadow:0 0 6px #00e5ff"></span> 最新趋势
      <span style="font-weight:400;font-size:12px;color:#8d9199;margin-left:auto">2025-05-31 | 共 6 次执行</span>
    </div>
    <div class="chart-wrap"><svg viewBox="0 0 680 280" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="areaGradB" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
        </linearGradient>
        <filter id="glowB">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowHeavy">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- Grid -->
      <g stroke="#1a2a3a" stroke-dasharray="3 5" stroke-width="0.8">
        <line x1="70" y1="40" x2="660" y2="40"/>
        <line x1="70" y1="120" x2="660" y2="120"/>
        <line x1="70" y1="200" x2="660" y2="200"/>
      </g>
      <!-- Axes -->
      <line x1="70" y1="30" x2="70" y2="230" stroke="#2a3a4a" stroke-width="1"/>
      <line x1="70" y1="230" x2="660" y2="230" stroke="#2a3a4a" stroke-width="1"/>
      <!-- Y ticks -->
      <text x="60" y="44" text-anchor="end" font-size="11" fill="#5a6a7a">120</text>
      <text x="60" y="124" text-anchor="end" font-size="11" fill="#5a6a7a">60</text>
      <text x="60" y="204" text-anchor="end" font-size="11" fill="#5a6a7a">0</text>
      <!-- X labels -->
      <text x="70" y="248" text-anchor="middle" font-size="11" fill="#5a6a7a">10:30</text>
      <text x="188" y="248" text-anchor="middle" font-size="11" fill="#5a6a7a">11:45</text>
      <text x="306" y="248" text-anchor="middle" font-size="11" fill="#5a6a7a">14:00</text>
      <text x="424" y="248" text-anchor="middle" font-size="11" fill="#5a6a7a">15:20</text>
      <text x="542" y="248" text-anchor="middle" font-size="11" fill="#5a6a7a">16:30</text>
      <text x="660" y="248" text-anchor="middle" font-size="11" fill="#5a6a7a">17:45</text>
      <!-- Area fill -->
      <polygon points="70,180 188,140 306,95 424,118 542,72 660,60 660,230 70,230" fill="url(#areaGradB)"/>
      <!-- Line -->
      <polyline points="70,180 188,140 306,95 424,118 542,72 660,60" fill="none" stroke="#00e5ff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowB)"/>
      <!-- Dots -->
      <circle cx="70" cy="180" r="5" fill="#0f1923" stroke="#00e5ff" stroke-width="2" filter="url(#glowB)"/>
      <circle cx="188" cy="140" r="5" fill="#0f1923" stroke="#00e5ff" stroke-width="2" filter="url(#glowB)"/>
      <circle cx="306" cy="95" r="5" fill="#0f1923" stroke="#00e5ff" stroke-width="2" filter="url(#glowB)"/>
      <circle cx="424" cy="118" r="5" fill="#0f1923" stroke="#00e5ff" stroke-width="2" filter="url(#glowB)"/>
      <circle cx="542" cy="72" r="5" fill="#0f1923" stroke="#00e5ff" stroke-width="2" filter="url(#glowB)"/>
      <circle cx="660" cy="60" r="5" fill="#0f1923" stroke="#00e5ff" stroke-width="2" filter="url(#glowB)"/>
      <!-- Labels -->
      <text x="70" y="169" text-anchor="middle" font-size="11" fill="#8d9199" font-weight="600">12</text>
      <text x="188" y="129" text-anchor="middle" font-size="11" fill="#8d9199" font-weight="600">18</text>
      <text x="306" y="84" text-anchor="middle" font-size="11" fill="#8d9199" font-weight="600">25</text>
      <text x="424" y="107" text-anchor="middle" font-size="11" fill="#8d9199" font-weight="600">20</text>
      <text x="542" y="61" text-anchor="middle" font-size="11" fill="#8d9199" font-weight="600">30</text>
      <text x="660" y="49" text-anchor="middle" font-size="11" fill="#8d9199" font-weight="600">36</text>
    </svg></div>
  </div>
</div>

<!-- ======== 方案 C ======== -->
<div class="section">
  <h2><span class="badge">方案 C</span> 极简霓虹线</h2>
  <p class="desc">无网格纯坐标轴、加粗线条 2.5px、圆点 pulse 脉冲动画</p>
  <div class="card">
    <div class="card-header">
      <span class="dot" style="background:#25676e"></span> 最新趋势
      <span style="font-weight:400;font-size:12px;color:var(--sub);margin-left:auto">2025-05-31 | 共 6 次执行</span>
    </div>
    <div class="chart-wrap"><svg viewBox="0 0 680 280" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
      <!-- Axes only -->
      <line x1="70" y1="30" x2="70" y2="230" stroke="#c4c7cc" stroke-width="1"/>
      <line x1="70" y1="230" x2="660" y2="230" stroke="#c4c7cc" stroke-width="1"/>
      <!-- Y ticks -->
      <text x="60" y="44" text-anchor="end" font-size="11" fill="#74777c">120</text>
      <text x="60" y="124" text-anchor="end" font-size="11" fill="#74777c">60</text>
      <text x="60" y="204" text-anchor="end" font-size="11" fill="#74777c">0</text>
      <!-- X labels -->
      <text x="70" y="248" text-anchor="middle" font-size="11" fill="#43474b">10:30</text>
      <text x="188" y="248" text-anchor="middle" font-size="11" fill="#43474b">11:45</text>
      <text x="306" y="248" text-anchor="middle" font-size="11" fill="#43474b">14:00</text>
      <text x="424" y="248" text-anchor="middle" font-size="11" fill="#43474b">15:20</text>
      <text x="542" y="248" text-anchor="middle" font-size="11" fill="#43474b">16:30</text>
      <text x="660" y="248" text-anchor="middle" font-size="11" fill="#43474b">17:45</text>
      <!-- Bold line -->
      <polyline points="70,180 188,140 306,95 424,118 542,72 660,60" fill="none" stroke="#25676e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Large dots -->
      <circle cx="70" cy="180" r="5" fill="#25676e"/>
      <circle cx="188" cy="140" r="5" fill="#25676e"/>
      <circle cx="306" cy="95" r="5" fill="#25676e"/>
      <circle cx="424" cy="118" r="5" fill="#25676e"/>
      <circle cx="542" cy="72" r="5" fill="#25676e"/>
      <circle cx="660" cy="60" r="5" fill="#25676e"/>
      <!-- Bold labels -->
      <text x="70" y="169" text-anchor="middle" font-size="11" fill="#25676e" font-weight="700">12</text>
      <text x="188" y="129" text-anchor="middle" font-size="11" fill="#25676e" font-weight="700">18</text>
      <text x="306" y="84" text-anchor="middle" font-size="11" fill="#25676e" font-weight="700">25</text>
      <text x="424" y="107" text-anchor="middle" font-size="11" fill="#25676e" font-weight="700">20</text>
      <text x="542" y="61" text-anchor="middle" font-size="11" fill="#25676e" font-weight="700">30</text>
      <text x="660" y="49" text-anchor="middle" font-size="11" fill="#25676e" font-weight="700">36</text>
    </svg></div>
  </div>
</div>

</body>
</html>
